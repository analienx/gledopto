name: Device research request
description: Propose another GLEDOPTO/Telink device for End Device / leaf firmware research
title: "[device] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for bringing another device candidate. This project is evidence-first: support is model/revision specific and is not inferred from branding or enclosure similarity.

  - type: input
    id: model
    attributes:
      label: Exact model
      placeholder: GL-SD-301P
    validations:
      required: true

  - type: input
    id: manufacturer
    attributes:
      label: Reported manufacturer
      placeholder: GLEDOPTO
    validations:
      required: true

  - type: textarea
    id: identity
    attributes:
      label: Firmware / hardware identity
      description: Paste exact values when available.
      placeholder: |
        hwVersion:
        swBuildId:
        dateCode:
        applicationVersion:
        stackVersion:
        manufacturerCode:
        imageType:
        fileVersion:
    validations:
      required: false

  - type: textarea
    id: zigbee
    attributes:
      label: Zigbee descriptor and current role
      description: Prefer raw Zigbee2MQTT/ZHA descriptor or interview text.
      placeholder: |
        current role: Router / End Device / unknown
        endpoints:
        input clusters:
        output clusters:
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would this device be better as a leaf?
      description: Describe observed network behavior rather than assuming the device is the cause.
      placeholder: Children attach to it and become unreliable; it is power-switched; I already have dedicated routers; etc.
    validations:
      required: true

  - type: textarea
    id: preserve
    attributes:
      label: Functionality that must be preserved
      placeholder: On/Off, Level, color temperature, RGB, physical PUSH, direct binding, groups, scenes, reporting, startup behavior, OTA recovery...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, public references, and other evidence
      description: Paste text or links. Do not casually upload copyrighted vendor firmware; hashes/provenance/public links are preferred.
      placeholder: Interview logs, OTA check metadata, Basic cluster reads, public firmware/docs, checksums, photos from safe de-energized access...
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety / provenance acknowledgement
      options:
        - label: I did not perform unsafe mains probing or flash a production device just to gather this request.
          required: true
        - label: Any firmware/reference material I mention has provenance, and I understand vendor firmware is not automatically relicensed by this project.
          required: true
