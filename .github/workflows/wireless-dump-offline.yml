name: Wireless dump offline regression

on:
  push:
    branches:
      - research/wireless-dump-stager
    paths:
      - 'firmware/wireless-dump-stager/**'
      - 'integrations/zigbee2mqtt/**'
      - 'tools/glsd_dump_protocol.py'
      - 'tools/glsd_wireless_dump_host.py'
      - 'tools/glsd_dump_session_guard.py'
      - 'tools/glsd_z2m_bridge.py'
      - 'tools/glsd_z2m_dump.py'
      - 'tools/telink_ota_forensics.py'
      - 'tools/telink_app_finalize.py'
      - 'tools/make_ota_acceptance_probe.py'
      - 'tools/make_glsd_stager_ota.py'
      - 'tools/make_glsd_stager_index.py'
      - 'tools/glsd_flash_preflight.py'
      - 'tools/glsd_release_plan.py'
      - 'tools/build_glsd_tc32_objects.sh'
      - 'tools/build_glsd_tc32_link_probe.sh'
      - 'tools/tests/test_wireless_dump.py'
      - 'tools/tests/test_wireless_dump_guard.py'
      - 'tools/tests/test_z2m_dump_integration.py'
      - 'tools/tests/test_glsd_stager_index.py'
      - 'tools/tests/test_glsd_stager_ota.py'
      - 'tools/tests/test_glsd_flash_preflight.py'
      - 'tools/tests/test_glsd_release_plan.py'
      - 'tools/tests/test_telink_app_finalize.py'
      - 'tools/tests/test_transport_adapter.py'
      - '.github/workflows/wireless-dump-offline.yml'
  pull_request:
    paths:
      - 'firmware/wireless-dump-stager/**'
      - 'integrations/zigbee2mqtt/**'
      - 'tools/glsd_dump_protocol.py'
      - 'tools/glsd_wireless_dump_host.py'
      - 'tools/glsd_dump_session_guard.py'
      - 'tools/glsd_z2m_bridge.py'
      - 'tools/glsd_z2m_dump.py'
      - 'tools/telink_ota_forensics.py'
      - 'tools/telink_app_finalize.py'
      - 'tools/make_ota_acceptance_probe.py'
      - 'tools/make_glsd_stager_ota.py'
      - 'tools/make_glsd_stager_index.py'
      - 'tools/glsd_flash_preflight.py'
      - 'tools/glsd_release_plan.py'
      - 'tools/build_glsd_tc32_objects.sh'
      - 'tools/build_glsd_tc32_link_probe.sh'
      - 'tools/tests/test_wireless_dump.py'
      - 'tools/tests/test_wireless_dump_guard.py'
      - 'tools/tests/test_z2m_dump_integration.py'
      - 'tools/tests/test_glsd_stager_index.py'
      - 'tools/tests/test_glsd_stager_ota.py'
      - 'tools/tests/test_glsd_flash_preflight.py'
      - 'tools/tests/test_glsd_release_plan.py'
      - 'tools/tests/test_telink_app_finalize.py'
      - 'tools/tests/test_transport_adapter.py'
      - '.github/workflows/wireless-dump-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Python ${{ matrix.python-version }} + native GCC + Z2M contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Show toolchain
        run: |
          python --version
          node --version
          gcc --version
      - name: Compile Python modules
        run: python -m compileall -q tools
      - name: Check offline TC32 harness shell syntax
        run: |
          bash -n tools/build_glsd_tc32_objects.sh
          bash -n tools/build_glsd_tc32_link_probe.sh
      - name: Check Zigbee2MQTT extension syntax and pure contract
        run: |
          node --check integrations/zigbee2mqtt/glsd_wireless_dump_contract.mjs
          node --check integrations/zigbee2mqtt/glsd_wireless_dump_extension.mjs
          node integrations/zigbee2mqtt/test_glsd_wireless_dump_contract.mjs
      - name: Run protocol, host, native C and cross-language tests
        run: python tools/tests/test_wireless_dump.py -v
      - name: Run guarded-session tests
        run: python tools/tests/test_wireless_dump_guard.py -v
      - name: Run radio transport adapter tests
        run: python tools/tests/test_transport_adapter.py -v
      - name: Run synthetic Z2M end-to-end tests
        run: python tools/tests/test_z2m_dump_integration.py -v
      - name: Run fail-closed OTA index tests
        run: python tools/tests/test_glsd_stager_index.py -v
      - name: Run Telink inner-image finalizer tests
        run: python tools/tests/test_telink_app_finalize.py -v
      - name: Run quarantined stager OTA wrapper tests
        run: python tools/tests/test_glsd_stager_ota.py -v
      - name: Run flash preflight gate tests
        run: python tools/tests/test_glsd_flash_preflight.py -v
      - name: Run exact-IEEE release-plan tests
        run: python tools/tests/test_glsd_release_plan.py -v

  tc32-object-proof:
    name: Pinned Telink TC32 + TLSR8258 bank-neutral link proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout supervisor branch
        uses: actions/checkout@v4
      - name: Checkout complete public TLSR8258 mechanics fixture
        uses: actions/checkout@v4
        with:
          repository: telink-semi/telink_zigbee_sdk
          ref: V3.7.2.0
          path: telink-sdk
      - name: Acquire hash-pinned official TC32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          url='https://shyboy.oss-cn-shenzhen.aliyuncs.com/readonly/tc32_gcc_v2.0.tar.bz2'
          expected='33b854be3e3db3dba4b4dacdda2cd4ea1c94dfd4d562864a095956de7991b430'
          archive="$RUNNER_TEMP/tc32_gcc_v2.0.tar.bz2"
          root="$RUNNER_TEMP/tc32"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "$expected  $archive" | sha256sum --check --strict
          mkdir -p "$root"
          tar -xjf "$archive" -C "$root"
          bindir="$(dirname "$(find "$root" -type f -name tc32-elf-gcc -print -quit)")"
          test -x "$bindir/tc32-elf-gcc"
          chmod +x "$bindir"/* || true
          echo "TC32_CC=$bindir/tc32-elf-gcc" >> "$GITHUB_ENV"
          echo "TC32_NM=$bindir/tc32-elf-nm" >> "$GITHUB_ENV"
          "$bindir/tc32-elf-gcc" --version | head -n 1
      - name: Compile minimal GL-SD target objects
        shell: bash
        run: |
          set -euo pipefail
          export TELINK_SDK_ROOT="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          export OUT_DIR="$RUNNER_TEMP/glsd-tc32-objects"
          bash tools/build_glsd_tc32_objects.sh
          cat "$OUT_DIR/build-manifest.txt"
      - name: Enforce private extraction and recovery call surface
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/glsd-tc32-objects/build-manifest.txt"
          ! grep -Eai '(^|[^[:alnum:]_])(flash_write|flash_erase|nv_flashWrite|nv_reset|factory|leave|boot.*marker.*write)' "$manifest"
          ! grep -Eq ' U ota_queryStart$' "$manifest"
          ! grep -Eq ' U bdb_networkSteerStart$' "$manifest"
          grep -Eq ' U ota_init$' "$manifest"
          grep -Eq ' U ota_mcuReboot$' "$manifest"
          grep -Eq ' U mcuBootAddrGet$' "$manifest"
          echo 'PRIVATE_EXTRACTION_MUTATION_IMPORTS=NONE'
          echo 'PERIODIC_OTA_QUERY_IMPORT=NONE'
          echo 'NETWORK_STEERING_IMPORT=NONE'
          echo 'NOTIFY_DRIVEN_OTA_RECOVERY_IMPORTS=PRESENT'
          echo 'RUNTIME_BOOT_BANK_DETECTION_IMPORT=PRESENT'
      - name: Link and validate one multi-address stager image for both physical banks
        shell: bash
        run: |
          set -euo pipefail
          export TELINK_SDK_ROOT="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          export OUT_DIR="$RUNNER_TEMP/glsd-tc32-link"
          bash tools/build_glsd_tc32_link_probe.sh
          cat "$OUT_DIR/neutral/manifest.txt"
      - name: Wrap bank-neutral image as quarantined OTA and validate target index
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/glsd-tc32-link/neutral"
          inner="$root/glsd-stager-neutral.final.bin"
          manifest="$root/manifest.txt"
          ota="$root/glsd-stager-neutral.quarantined.ota"
          sidecar="$ota.quarantine.json"
          index="$root/glsd-stager-neutral.index.json"
          python tools/make_glsd_stager_ota.py "$inner" --out "$ota" --build-manifest "$manifest" --offline-build-quarantined
          python tools/telink_ota_forensics.py "$ota" --json > "$root/ota-analysis.json"
          python tools/make_glsd_stager_index.py "$ota" --url "file:///QUARANTINED/glsd-stager-neutral.ota" --out "$index"
          python -c "import json,pathlib,sys; e=json.loads(pathlib.Path(sys.argv[1]).read_text())[0]; assert e['manufacturerCode']==0x124F and e['imageType']==0x1416 and e['fileVersion']==0x7F010001 and e['hardwareVersionMin']==2 and e['hardwareVersionMax']==2; print('QUARANTINED_OTA_INDEX_GATE=PASS')" "$index"
          python -c "import json,pathlib,sys; m=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert m['bankNeutral'] is True and m['logicalLinkBase']==0 and m['physicalBootTargets']==[0,0x40000] and m['runtimeBootBankDetection']=='mcuBootAddrGet' and m['innerValid'] is True; print('MULTI_ADDRESS_ATTESTATION_GATE=PASS')" "$sidecar"
          set +e
          python tools/glsd_flash_preflight.py "$sidecar" > "$root/flash-preflight-current.json"
          rc=$?
          set -e
          test "$rc" -eq 3
          python -c "import json,pathlib,sys; r=json.loads(pathlib.Path(sys.argv[1]).read_text()); required={'PRODUCTION_MCU_UNPROVEN','PRODUCTION_FLASH_GEOMETRY_UNPROVEN','PRODUCTION_REVISION_UNPROVEN','RETURN_TO_STOCK_SPARE_NOT_PASSED'}; assert required.issubset(set(r['blockers'])); assert 'ACTIVE_BANK_UNKNOWN' not in r['blockers']; assert r['activeBankRequiredForFirstOta'] is False; assert r['FLASH_WRITE_PRECONDITIONS_PASS'] is False; assert r['AUTHORIZATION_GRANTED'] is False; print('CURRENT_FLASH_PREFLIGHT_FAIL_CLOSED=PASS')" "$root/flash-preflight-current.json"
          echo 'QUARANTINED_REAL_TC32_OTA_WRAPPER=PASS_BANK_NEUTRAL'
          echo 'TELINK_MULTI_ADDRESS_FIRST_OTA_ACTIVE_BANK_REQUIRED=NO'
          echo 'FLASH_PREFLIGHT=CURRENTLY_BLOCKED_AS_DESIGNED'
          echo 'NO_ARTIFACT_UPLOAD=YES'
