name: Integrate clean GL-SD power stage

on:
  push:
    branches:
      - build/glsd301p-clean-interop-integration-20260907
    paths:
      - '.github/workflows/integrate-clean-power-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/glsd301p-clean-interop-integration-20260907
          fetch-depth: 0

      - name: Integrate tested interoperability modules into product build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected integration anchor missing in {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          app = 'firmware/gl-sd-301p-ed/glsd_telink_ed_app.c'
          replace_once(
              app,
              '#include "glsd_power_stage.h"\n',
              '#include "glsd_power_stage.h"\n'
              '#include "glsd301p_push_input.h"\n'
              '#include "glsd301p_pb4_compat.h"\n',
          )
          replace_once(
              app,
              '#define GLSD_MOVE_TICK_MS                100u\n',
              '#define GLSD_MOVE_TICK_MS                100u\n'
              '#define GLSD_LOCAL_IO_TICK_MS            1u\n',
          )
          replace_once(
              app,
              'static ev_timer_event_t *g_rejoin_timer;\n',
              'static ev_timer_event_t *g_rejoin_timer;\n'
              'static ev_timer_event_t *g_local_io_timer;\n'
              'static glsd301p_push_decoder_t g_push_decoder;\n'
              'static glsd301p_pb4_compat_t g_pb4_compat;\n',
          )
          stop_anchor = '''static void glsd_stop_move(void)\n{\n    if (g_move_timer) {\n        TL_ZB_TIMER_CANCEL(&g_move_timer);\n    }\n    g_move_timer = NULL;\n    g_move_delta = 0;\n    g_level_remaining = 0;\n}\n'''
          local_io = stop_anchor + r'''

static s32 glsd_local_io_tick(void *arg)
{
    glsd301p_push_event_t event;
    (void)arg;

    if (!g_power_ready) {
        g_local_io_timer = NULL;
        return -1;
    }

    event = glsd301p_push_decoder_poll(
        &g_push_decoder,
        glsd_power_stage_pc2_high() != 0);

    if (event == GLSD301P_PUSH_EVENT_TOGGLE) {
        glsd_stop_move();
        if (glsd_ed_toggle(&g_core) == GLSD_ED_OK) {
            glsd_sync_attrs();
        }
    } else if (event == GLSD301P_PUSH_EVENT_LEVEL_STEP && g_core.on) {
        const glsd301p_push_dim_direction_t direction =
            glsd301p_push_decoder_direction(&g_push_decoder);
        const uint8_t next = glsd301p_push_level_step(g_core.level, direction);
        glsd_stop_move();
        if (glsd_ed_set_level(&g_core, next, 0u) == GLSD_ED_OK) {
            glsd_sync_attrs();
        }
    }

    if (glsd301p_pb4_compat_poll(
            &g_pb4_compat,
            glsd_power_stage_pb4_high() != 0)) {
        /* Stock behavior deliberately does not alter g_core.level and does not
         * emit a full-level restore merely because PB4 later goes low. */
        (void)glsd_power_stage_apply_pb4_aux(g_core.level);
    }

    return 0;
}
'''
          replace_once(app, stop_anchor, local_io)
          replace_once(
              app,
              '    g_power_ready = (glsd_power_stage_init() == 0) ? 1u : 0u;\n',
              '    glsd301p_push_decoder_init(&g_push_decoder);\n'
              '    glsd301p_pb4_compat_init(&g_pb4_compat);\n'
              '    g_power_ready = (glsd_power_stage_init() == 0) ? 1u : 0u;\n',
          )
          replace_once(
              app,
              '    (void)bdb_init((af_simple_descriptor_t *)&g_simple_desc,\n'
              '                   &g_bdb_settings, &g_bdb_callbacks, 1);\n',
              '    (void)bdb_init((af_simple_descriptor_t *)&g_simple_desc,\n'
              '                   &g_bdb_settings, &g_bdb_callbacks, 1);\n'
              '    if (g_power_ready) {\n'
              '        g_local_io_timer = TL_ZB_TIMER_SCHEDULE(\n'
              '            glsd_local_io_tick, NULL, GLSD_LOCAL_IO_TICK_MS);\n'
              '    }\n',
          )

          link = 'tools/build_glsd_ed_tc32_link.sh'
          replace_once(link, 'SRC="$ROOT/firmware/gl-sd-301p-ed"\n',
                       'SRC="$ROOT/firmware/gl-sd-301p-ed"\nINTEROP="$ROOT/src"\n')
          replace_once(
              link,
              'includes=(-I"$FIXTURE" -I"$SAMPLE_DIR" -I"$COMMON_APP" -I"$SDK/proj")\n',
              'includes=(-I"$FIXTURE" -I"$SAMPLE_DIR" -I"$COMMON_APP" -I"$SDK/proj" -I"$SRC" -I"$INTEROP")\n',
          )
          replace_once(
              link,
              '''app_sources=(\n  glsd_ed_core.c\n  glsd_power_stage_stub.c\n  glsd_telink_ed_app.c\n  glsd_telink_disabled_feature_glue.c\n)\n''',
              '''app_sources=(\n  glsd_ed_core.c\n  glsd_power_stage_telink.c\n  glsd_telink_ed_app.c\n  glsd_telink_disabled_feature_glue.c\n)\n\ninterop_sources=(\n  glsd301p_uart_frame.c\n  glsd301p_power_stage_policy.c\n  glsd301p_push_input.c\n  glsd301p_pb4_compat.c\n)\n''',
          )
          app_loop = '''for rel in "${app_sources[@]}"; do\n  src="$SRC/$rel"\n  [[ -f "$src" ]] || { echo "ERROR: product source missing: $rel" >&2; exit 2; }\n  obj="$DIR/obj/app/${rel%.c}.o"\n  compile_one "$src" "$obj" 0\n  objects+=("$obj")\ndone\n'''
          replace_once(
              link,
              app_loop,
              app_loop + '''\nfor rel in "${interop_sources[@]}"; do\n  src="$INTEROP/$rel"\n  [[ -f "$src" ]] || { echo "ERROR: interoperability source missing: $rel" >&2; exit 2; }\n  obj="$DIR/obj/app/${rel%.c}.o"\n  compile_one "$src" "$obj" 0\n  objects+=("$obj")\ndone\n''',
          )
          replace_once(
              link,
              'python3 "$FINALIZER" check-link "$bin" --max-final-size "$APP_SLOT_SIZE"\n'
              'python3 "$FINALIZER" finalize "$bin" "$final_bin" --max-final-size "$APP_SLOT_SIZE"\n'
              'python3 "$FINALIZER" check-final "$final_bin" --max-final-size "$APP_SLOT_SIZE"\n',
              '''file_version="$(awk '/^[[:space:]]*#define[[:space:]]+FILE_VERSION[[:space:]]+/ {print $3; exit}' "$FIXTURE/version_cfg.h")"\n[[ "$file_version" =~ ^0[xX][0-9A-Fa-f]+$ ]] || { echo "ERROR: cannot parse FILE_VERSION" >&2; exit 2; }\npython3 "$FINALIZER" check-link "$bin" --file-version "$file_version" --max-final-size "$APP_SLOT_SIZE"\npython3 "$FINALIZER" finalize "$bin" "$final_bin" --file-version "$file_version" --max-final-size "$APP_SLOT_SIZE"\npython3 "$FINALIZER" check-final "$final_bin" --file-version "$file_version" --max-final-size "$APP_SLOT_SIZE"\n''',
          )
          replace_once(
              link,
              '''  echo DEPLOYABLE=NO\n  echo DEPLOYABLE_BLOCKER=POWER_STAGE_DRIVER_STUB\n  echo POWER_STAGE_DRIVER=STUB\n''',
              '''  echo FLASHABLE_ARTIFACT=YES\n  echo DEPLOY_AUTHORIZED=NO\n  echo DEPLOYABLE=NO\n  echo DEPLOYABLE_BLOCKER=SACRIFICIAL_CANARY_NOT_YET_VALIDATED\n  echo POWER_STAGE_DRIVER=UART_GLSD301P\n  echo POWER_STAGE_PROTOCOL_GATE=PASS_STATIC\n''',
          )
          replace_once(
              link,
              "echo 'STOP: product image is non-deployable until glsd_power_stage_stub.c is replaced by the verified GL-SD hardware driver.'\n",
              "echo 'STOP: structurally flashable artifact built; deployment remains unauthorized until sacrificial-canary validation.'\n",
          )

          wf = '.github/workflows/glsd-ed-firmware.yml'
          replace_once(wf, '      - research/wireless-dump-stager\n',
                       '      - build/glsd301p-clean-interop-integration-20260907\n')
          replace_once(
              wf,
              "      - 'firmware/gl-sd-301p-ed/**'\n",
              "      - 'firmware/gl-sd-301p-ed/**'\n      - 'src/**'\n",
          )
          # The paths block appears twice; update the pull_request occurrence too.
          s = Path(wf).read_text()
          needle = "  pull_request:\n    paths:\n      - 'firmware/gl-sd-301p-ed/**'\n"
          if needle not in s:
              raise SystemExit('pull_request workflow path anchor missing')
          s = s.replace(needle, needle + "      - 'src/**'\n", 1)
          s = s.replace("grep -q '^GLSD_ED_TC32_OBJECT_COMPILE=PASS_3_OF_3$' \"$manifest\"",
                        "grep -q '^GLSD_ED_TC32_OBJECT_COMPILE=PASS_7_OF_7$' \"$manifest\"")
          s = s.replace("grep -q '^DEPLOYABLE_BLOCKER=POWER_STAGE_DRIVER_STUB$' \"$manifest\"",
                        "grep -q '^DEPLOYABLE_BLOCKER=SACRIFICIAL_CANARY_NOT_YET_VALIDATED$' \"$manifest\"\n          grep -q '^POWER_STAGE_DRIVER=UART_GLSD301P$' \"$manifest\"\n          grep -q '^FLASHABLE_ARTIFACT=YES$' \"$manifest\"\n          grep -q '^DEPLOY_AUTHORIZED=NO$' \"$manifest\"")
          s = s.replace("echo 'GLSD_ED_COMPLETE_PRODUCT_LINK=PASS_NONDEPLOYABLE'",
                        "echo 'GLSD_ED_COMPLETE_PRODUCT_LINK=PASS_STATIC_NO_DEPLOY_AUTH'")
          Path(wf).write_text(s)

          # Remove the obsolete compile/link refusal implementation.
          Path('firmware/gl-sd-301p-ed/glsd_power_stage_stub.c').unlink()
          PY

      - name: Validate clean-room boundary after integration
        run: python3 tools/check_cleanroom.py

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate solved UART, PUSH and PB4 hardware adapters'
          git push origin HEAD:build/glsd301p-clean-interop-integration-20260907
