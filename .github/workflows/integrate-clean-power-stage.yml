name: Integrate clean GL-SD power stage

on:
  push:
    branches:
      - build/glsd301p-clean-interop-integration-20260907
    paths:
      - '.github/workflows/integrate-clean-power-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/glsd301p-clean-interop-integration-20260907
          fetch-depth: 0

      - name: Apply deterministic integration patch
        run: python3 tools/integrate_clean_power_stage.py

      - name: Validate clean-room boundary after integration
        run: python3 tools/check_cleanroom.py

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate solved UART, PUSH and PB4 hardware adapters'
          git push origin HEAD:build/glsd301p-clean-interop-integration-20260907
