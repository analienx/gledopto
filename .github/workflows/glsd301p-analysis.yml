name: Analyze GL-SD-301P Vendor Firmware
on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download and extract GL-SD-301P firmware
        run: |
          mkdir -p incoming
          for i in $(seq 0 12); do
            part=$(printf "%03d" $i)
            echo "Downloading part $part..."
            curl -sL "https://raw.githubusercontent.com/analienx/gledopto/main/devices/gl-sd-301p/vendor-firmware/.incoming/GL-SD-301P_V20851203_20251230.ota.xz.b64.part$part" -o "incoming/part$part"
          done
          
          echo "Concatenating..."
          cat incoming/part* > full.b64
          
          echo "Decoding base64..."
          base64 -d full.b64 > full.xz
          
          echo "Decompressing..."
          xz -d full.xz
          mv full full.ota
          
          ls -lh full.ota
          
      - name: Analyze firmware patterns
        run: |
          cat > analyze_firmware.py << 'PYEOF'
          import struct
          import re
          from pathlib import Path

          ota_data = Path("full.ota").read_bytes()
          
          print(f"Total OTA size: {len(ota_data)} bytes")
          
          # Parse OTA header
          magic, = struct.unpack_from("<I", ota_data, 0)
          header_length, = struct.unpack_from("<H", ota_data, 6)
          manufacturer_code, = struct.unpack_from("<H", ota_data, 10)
          image_type, = struct.unpack_from("<H", ota_data, 12)
          file_version, = struct.unpack_from("<I", ota_data, 14)
          
          header_string = ota_data[28:60].split(b'\x00')[0].decode('ascii', errors='replace')
          
          print(f"Magic: {hex(magic)}")
          print(f"Header length: {header_length}")
          print(f"Manufacturer: {hex(manufacturer_code)}")
          print(f"Image type: {hex(image_type)}")
          print(f"File version: {hex(file_version)}")
          print(f"Header string: '{header_string}'")
          
          inner = ota_data[header_length:]
          print(f"Inner image size: {len(inner)} bytes")
          
          def find_strings(data, min_len=4):
              pattern = re.compile(rb'[\x20-\x7e]{%d,}' % min_len)
              return [(m.start(), m.group().decode('ascii', errors='replace')) for m in pattern.finditer(data)]

          def search_patterns(data):
              results = {}
              patterns = {
                  'tuya_headers': [b'\x55\xaa'],
                  'tuya_strings': [b'tuya', b'TUYA', b'dp_id', b'mcu_send'],
                  'uart_strings': [b'uart', b'UART', b'serial', b'baud', b'115200', b'9600', b'19200'],
                  'gpio_strings': [b'gpio', b'GPIO', b'pwm', b'PWM', b'timer', b'dimmer'],
                  'telink_strings': [b'TLSR', b'tlsr', b'8258', b'8266', b'B91', b'telink'],
                  'vendor_strings': [b'GLEDOPTO', b'gledopto', b'Candeo', b'GL-SD', b'GL-C']
              }
              
              for category, search_bytes in patterns.items():
                  results[category] = {}
                  for s in search_bytes:
                      positions = []
                      pos = 0
                      while True:
                          pos = data.find(s, pos)
                          if pos == -1:
                              break
                          positions.append(pos)
                          pos += 1
                      if positions:
                          results[category][s.decode('ascii', errors='replace')] = len(positions)
              return results

          strings = find_strings(inner, min_len=4)
          keywords = ['uart', 'gpio', 'pwm', 'timer', 'dim', 'level', 'tuya', 'mcu', 'serial', 
                     'baud', 'zigbee', 'telink', 'tlsr', '8258', '8266', 'b91', 'gledopto', 'candeo', '8251']
          interesting = [(off, s) for off, s in strings if any(kw in s.lower() for kw in keywords)]
          
          print(f"\n=== INTERESTING STRINGS (top 50) ===")
          for offset, s in interesting[:50]:
              print(f"  0x{offset:06X}: {s}")
              
          print(f"\n=== PATTERN ANALYSIS ===")
          results = search_patterns(inner)
          
          for category, data in results.items():
              if data:
                  total_hits = sum(data.values())
                  print(f"{category}: {total_hits} total hits")
                  for key, count in sorted(data.items(), key=lambda x: x[1], reverse=True)[:5]:
                      print(f"  '{key}': {count} hits")
                      
          print(f"\n{'='*60}")
          print("DECISION MATRIX")
          print(f"{'='*60}")
          
          tuya_count = sum(results.get('tuya_headers', {}).values())
          uart_total = sum(results.get('uart_strings', {}).values())
          gpio_total = sum(results.get('gpio_strings', {}).values())
          
          print(f"Tuya header (0x55 0xAA): {tuya_count}")
          print(f"UART-related hits: {uart_total}")
          print(f"GPIO/PWM-related hits: {gpio_total}")
          
          if tuya_count > 5:
              print("→ HIGH PROBABILITY: Tuya-compatible UART protocol")
          elif uart_total > gpio_total * 2:
              print("→ LIKELY: Secondary MCU over UART (non-Tuya)")
          elif gpio_total > uart_total * 2:
              print("→ LIKELY: Direct GPIO/PWM control")
          else:
              print("→ INCONCLUSIVE: Need deeper disassembly")
          PYEOF
          
          python analyze_firmware.py
