name: Interoperability boundary and host tests

on:
  push:
    branches:
      - main
      - cleanroom/glsd301p-interoperability-20260907
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "SOURCE_HEAD=$actual"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          test "$actual" = "$EXPECTED_HEAD"
      - name: Checkout pinned public Telink SDK (host harness)
        uses: actions/checkout@v4
        with:
          repository: telink-semi/telink_zigbee_sdk
          ref: V3.7.2.0
          path: telink-sdk
      - name: Verify exact SDK commit (host harness)
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C telink-sdk rev-parse HEAD)"
          expected='d5bc2f7b0c1f8536fe21c8127ca680ea8214bc8e'
          test "$actual" = "$expected"
          echo "TELINK_SDK_COMMIT=$actual"
      - name: Snapshot pristine SDK bodies for original-body repro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/orig-sdk/proj/os build/orig-sdk/proj/common
          mkdir -p build/orig-sdk/zigbee/zcl/general
          mkdir -p build/orig-sdk/zigbee/zcl/ota_upgrading
          mkdir -p build/orig-sdk/zigbee/af build/orig-sdk/zigbee/aps
          sdk='telink-sdk/tl_zigbee_sdk'
          cp "$sdk/proj/os/ev_buffer.c" "$sdk/proj/os/ev_buffer.h" build/orig-sdk/proj/os/
          cp "$sdk/proj/os/ev_timer.c" "$sdk/proj/os/ev_timer.h" build/orig-sdk/proj/os/
          cp "$sdk/proj/os/ev_rtc.c" "$sdk/proj/os/ev_rtc.h" build/orig-sdk/proj/os/
          cp "$sdk/proj/os/ev.h" build/orig-sdk/proj/os/
          cp "$sdk/proj/common/mempool.c" "$sdk/proj/common/mempool.h" build/orig-sdk/proj/common/
          cp "$sdk/proj/common/utlist.h" "$sdk/proj/common/types.h" \
            "$sdk/proj/common/utility.h" "$sdk/proj/common/bit.h" \
            "$sdk/proj/common/macro_trick.h" build/orig-sdk/proj/common/
          cp tests/host/tl_common.h build/orig-sdk/proj/tl_common.h
          cp "$sdk/zigbee/zcl/zcl.c" "$sdk/zigbee/zcl/zcl_reporting.c" \
            "$sdk/zigbee/zcl/zcl.h" "$sdk/zigbee/zcl/zcl_const.h" \
            "$sdk/zigbee/zcl/zcl_config.h" build/orig-sdk/zigbee/zcl/
          # zcl.c includes "ota.h" (real path zigbee/ota/ota.h); co-locate
          # it so the include resolves without new -I roots.
          cp "$sdk/zigbee/ota/ota.h" build/orig-sdk/zigbee/zcl/ota.h
          cp "$sdk/zigbee/zcl/general/zcl_basic.c" \
            "$sdk/zigbee/zcl/general/zcl_identify.c" \
            "$sdk/zigbee/zcl/general/zcl_group.c" \
            "$sdk/zigbee/zcl/general/zcl_level.c" \
            "$sdk/zigbee/zcl/general/zcl_onoff.c" \
            build/orig-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_basic.h" \
            "$sdk/zigbee/zcl/general/zcl_identify.h" \
            "$sdk/zigbee/zcl/general/zcl_group.h" \
            "$sdk/zigbee/zcl/general/zcl_level.h" \
            "$sdk/zigbee/zcl/general/zcl_onoff.h" \
            build/orig-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/ota_upgrading/zcl_ota.c" \
            "$sdk/zigbee/zcl/ota_upgrading/zcl_ota.h" \
            build/orig-sdk/zigbee/zcl/ota_upgrading/
          cp "$sdk/zigbee/af/zb_af.h" build/orig-sdk/zigbee/af/
          cp "$sdk/zigbee/aps/aps_api.h" build/orig-sdk/zigbee/aps/
          cp tests/host/zcl_shim/zcl_include.h build/orig-sdk/zigbee/zcl/zcl_include.h
          echo 'PRISTINE_SDK_BODY_HASHES (pre-patch, sha256):'
          (cd telink-sdk/tl_zigbee_sdk && sha256sum \
            proj/os/ev_buffer.c proj/os/ev_timer.c proj/os/ev_rtc.c \
            proj/common/mempool.c zigbee/zcl/zcl.c \
            zigbee/zcl/zcl_reporting.c zigbee/zcl/general/zcl_basic.c \
            zigbee/zcl/general/zcl_identify.c zigbee/zcl/general/zcl_group.c \
            zigbee/zcl/general/zcl_level.c zigbee/zcl/general/zcl_onoff.c \
            zigbee/zcl/ota_upgrading/zcl_ota.c)
      - name: Apply pinned SDK patches + stage harness shadow tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 tools/apply_glsd301p_sdk_patches.py \
            --sdk-root telink-sdk/tl_zigbee_sdk \
            --provenance-out build/sdk-patches-harness.json
          mkdir -p build/host-sdk/proj/os build/host-sdk/proj/common
          mkdir -p build/host-sdk/zigbee/zcl/general build/host-sdk/zigbee/af
          mkdir -p build/host-sdk/zigbee/aps
          mkdir -p build/host-sdk/zigbee/zcl/ota_upgrading
          sdk='telink-sdk/tl_zigbee_sdk'
          cp "$sdk/proj/os/ev_timer.c" build/host-sdk/proj/os/
          cp "$sdk/proj/os/ev_timer.h" build/host-sdk/proj/os/
          cp "$sdk/proj/os/ev_rtc.c" build/host-sdk/proj/os/
          cp "$sdk/proj/os/ev_rtc.h" build/host-sdk/proj/os/
          cp "$sdk/proj/os/ev.h" build/host-sdk/proj/os/
          cp "$sdk/proj/os/ev_buffer.c" build/host-sdk/proj/os/
          cp "$sdk/proj/os/ev_buffer.h" build/host-sdk/proj/os/
          cp "$sdk/proj/common/utlist.h" build/host-sdk/proj/common/
          cp "$sdk/proj/common/types.h" build/host-sdk/proj/common/
          cp "$sdk/proj/common/utility.h" build/host-sdk/proj/common/
          cp "$sdk/proj/common/bit.h" build/host-sdk/proj/common/
          cp "$sdk/proj/common/macro_trick.h" build/host-sdk/proj/common/
          cp "$sdk/proj/common/mempool.c" build/host-sdk/proj/common/
          cp "$sdk/proj/common/mempool.h" build/host-sdk/proj/common/
          cp tests/host/tl_common.h build/host-sdk/proj/tl_common.h
          cp "$sdk/zigbee/zcl/zcl.c" build/host-sdk/zigbee/zcl/
          cp "$sdk/zigbee/zcl/zcl_reporting.c" build/host-sdk/zigbee/zcl/
          cp "$sdk/zigbee/zcl/general/zcl_basic.c" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_identify.c" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_group.c" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_level.c" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_onoff.c" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_basic.h" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_identify.h" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_group.h" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_level.h" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/general/zcl_onoff.h" build/host-sdk/zigbee/zcl/general/
          cp "$sdk/zigbee/zcl/ota_upgrading/zcl_ota.c" build/host-sdk/zigbee/zcl/ota_upgrading/
          cp "$sdk/zigbee/zcl/ota_upgrading/zcl_ota.h" build/host-sdk/zigbee/zcl/ota_upgrading/
          cp "$sdk/zigbee/zcl/zcl.h" "$sdk/zigbee/zcl/zcl_const.h" \
            "$sdk/zigbee/zcl/zcl_config.h" build/host-sdk/zigbee/zcl/
          # zcl.c includes "ota.h" (real path zigbee/ota/ota.h); co-locate
          # it so the include resolves without new -I roots.
          cp "$sdk/zigbee/ota/ota.h" build/host-sdk/zigbee/zcl/ota.h
          cp "$sdk/zigbee/af/zb_af.h" build/host-sdk/zigbee/af/
          cp "$sdk/zigbee/aps/aps_api.h" build/host-sdk/zigbee/aps/
          cp tests/host/zcl_shim/zcl_include.h build/host-sdk/zigbee/zcl/zcl_include.h
          # The staged ZCL files must not key any behavior off the -DWIN32
          # size_t opt-out used for the host compile (types.h itself, which
          # owns the opt-out, is excluded: M3-justified, unchanged).
          if grep -rq 'WIN32' build/host-sdk/zigbee/ \
              build/host-sdk/proj/common/utility.h \
              build/host-sdk/proj/common/macro_trick.h; then
            echo 'ERROR: WIN32-keyed behavior in staged ZCL files' >&2
            exit 1
          fi
          # bit.h is staged only for BIT(). Its sole WIN32 divergence at the
          # pinned commit is MSVC __pragma wrappers around the SET_FLD_Vn
          # family, so prove that family textually absent from the staged
          # ZCL set: then -DWIN32 provably changes no compiled behavior.
          if grep -rq 'SET_FLD_V' build/host-sdk/zigbee/; then
            echo 'ERROR: WIN32-divergent bit.h macro used by staged ZCL' >&2
            exit 1
          fi
          python3 - build/sdk-patches-harness.json <<'PY'
          import hashlib, json, re, sys
          report = json.load(open(sys.argv[1]))
          pinned = {p['id']: p['patched_sha256'] for p in report['patches']}
          staged = {
              'P1-timebase-hook': 'build/host-sdk/proj/os/ev_timer.c',
              'P2a-level-parse': 'build/host-sdk/zigbee/zcl/general/zcl_level.c',
              'P2b-onoff-parse': 'build/host-sdk/zigbee/zcl/general/zcl_onoff.c',
          }
          for pid, path in staged.items():
              actual = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              assert actual == pinned[pid], (pid, actual, pinned[pid])
          print('HARNESS_SDK_SHADOW=PASS exact-patched-ev_timer-zcl_level-zcl_onoff')
          # The ZCL shim cluster selection must mirror app_cfg.h value for
          # value, so the real zcl_config.h derives the target-identical
          # bare-cluster macro set in the harness.
          def support_map(path):
              out = {}
              for m in re.finditer(r'#define\s+(ZCL_\w+_SUPPORT)\s+([01])',
                                   open(path).read()):
                  out[m.group(1)] = m.group(2)
              return out
          app = support_map('firmware/glsd301p-ed/app_cfg.h')
          shim = support_map('tests/host/zcl_shim/zcl_include.h')
          assert app, 'no SUPPORT macros parsed from app_cfg.h'
          assert app == shim, (
              sorted(set(app) ^ set(shim)),
              {k: (app.get(k), shim.get(k)) for k in set(app) | set(shim)
               if app.get(k) != shim.get(k)},
          )
          print('HARNESS_ZCL_CONFIG_MIRROR=PASS %d SUPPORT macros' % len(app))
          PY
      - name: Validate third-party/reference/implementation boundary
        run: python3 tools/check_cleanroom.py
      - name: Check target build harness syntax
        run: |
          bash -n tools/build_glsd301p_ed_tc32.sh
          bash -n tools/probe_telink_role_symbol_ownership.sh
          python3 -m py_compile tools/apply_glsd301p_sdk_patches.py
          python3 -m py_compile tools/glsd301p_health_decode.py
          python3 -m py_compile tools/tests/test_glsd301p_health_decode.py
          python3 -m py_compile devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard.py
          python3 -m py_compile devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard_callsite.py
          python3 -m py_compile devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard_semantics.py
          python3 -m py_compile devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard_callgraph.py
          python3 -m py_compile devices/gl-sd-301p/vendor-firmware/reference-analysis/diagnose_adc_call_abi.py
          python3 -m py_compile devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard_argflow.py
      - name: Build host-side interoperability tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host-tests
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/glsd301p_uart_frame.c src/glsd301p_power_stage_policy.c tests/test_glsd301p_uart_frame.c -o build/host-tests/test_glsd301p_uart_frame
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/glsd301p_push_input.c tests/test_glsd301p_push_input.c -o build/host-tests/test_glsd301p_push_input
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/glsd301p_uart_frame.c src/glsd301p_pb4_compat.c tests/test_glsd301p_pb4_compat.c -o build/host-tests/test_glsd301p_pb4_compat
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/glsd301p_uart_transport.c tests/test_glsd301p_uart_transport.c -o build/host-tests/test_glsd301p_uart_transport
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/glsd301p_uart_frame.c src/glsd301p_power_stage_policy.c src/glsd301p_output_guard.c tests/test_glsd301p_output_guard.c -o build/host-tests/test_glsd301p_output_guard
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/glsd301p_uart_frame.c src/glsd301p_power_stage_policy.c src/glsd301p_output_guard.c src/glsd301p_push_input.c src/glsd301p_pb4_compat.c src/glsd301p_runtime_core.c tests/test_glsd301p_runtime_core.c -o build/host-tests/test_glsd301p_runtime_core
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/glsd301p_uart_frame.c src/glsd301p_uart_transport.c src/glsd301p_power_stage_policy.c src/glsd301p_output_guard.c src/glsd301p_push_input.c src/glsd301p_pb4_compat.c src/glsd301p_runtime_core.c tests/test_glsd301p_runtime_transport.c -o build/host-tests/test_glsd301p_runtime_transport
      - name: Build M3 hardening harnesses (real SDK timer bodies + ASan/UBSan)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host-tests/obj
          strict="-std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer"
          # Pinned third-party SDK bodies compile without -Werror; behavior is
          # pinned by hash and covered by the harness assertions instead.
          # -DWIN32 is the SDK's own 32-bit size_t opt-out (types.h); none of
          # the staged SDK files key any other behavior off it (verified at
          # the pinned commit), and glibc provides size_t on the host.
          sdkflags="-std=gnu11 -DWIN32 -fsanitize=address,undefined -fno-omit-frame-pointer"
          inc="-Isrc -Itests/host"
          sdksrc='build/host-sdk/proj/os'
          # shellcheck disable=SC2086
          cc $sdkflags -Ibuild/host-sdk/proj -Ibuild/host-sdk/proj/os -Itests/host -Isrc \
            -c "$sdksrc/ev_timer.c" -o build/host-tests/obj/ev_timer.o
          # shellcheck disable=SC2086
          cc $sdkflags -Ibuild/host-sdk/proj -Ibuild/host-sdk/proj/os -Itests/host \
            -c "$sdksrc/ev_rtc.c" -o build/host-tests/obj/ev_rtc.o
          # shellcheck disable=SC2086
          cc $sdkflags -Ibuild/host-sdk/proj -Ibuild/host-sdk/proj/os -Itests/host -Isrc \
            -c src/glsd301p_timer_events.c -o build/host-tests/obj/timer_events.o
          sdkobj='build/host-tests/obj/ev_timer.o build/host-tests/obj/ev_rtc.o'
          # shellcheck disable=SC2086
          cc $strict $inc src/glsd301p_timebase.c tests/test_glsd301p_timebase.c \
            -o build/host-tests/test_glsd301p_timebase
          # shellcheck disable=SC2086
          cc $strict $inc src/glsd301p_uart_frame.c src/glsd301p_uart_transport.c \
            src/glsd301p_timebase.c src/glsd301p_uart_service.c tests/host/hw_stub.c \
            tests/test_glsd301p_uart_service.c -o build/host-tests/test_glsd301p_uart_service
          # shellcheck disable=SC2086
          cc $strict -Ibuild/host-sdk/proj/os $inc $sdkobj \
            build/host-tests/obj/timer_events.o src/glsd301p_timebase.c tests/host/hw_stub.c \
            tests/test_glsd301p_timer_events.c -o build/host-tests/test_glsd301p_timer_events
          # shellcheck disable=SC2086
          cc $strict -Ibuild/host-sdk/proj/os $inc $sdkobj \
            build/host-tests/obj/timer_events.o src/glsd301p_uart_frame.c \
            src/glsd301p_power_stage_policy.c src/glsd301p_output_guard.c \
            src/glsd301p_push_input.c src/glsd301p_pb4_compat.c src/glsd301p_runtime_core.c \
            src/glsd301p_uart_transport.c src/glsd301p_timebase.c src/glsd301p_uart_service.c \
            src/glsd301p_control.c src/glsd301p_identify.c tests/host/hw_stub.c tests/test_glsd301p_control.c \
            -o build/host-tests/test_glsd301p_control
          # shellcheck disable=SC2086
          cc $strict $inc src/glsd301p_timebase.c src/glsd301p_rejoin.c \
            src/glsd301p_bdb_adapter.c \
            tests/test_glsd301p_rejoin.c -o build/host-tests/test_glsd301p_rejoin
          # shellcheck disable=SC2086
          cc $strict $inc src/glsd301p_health.c tests/test_glsd301p_health.c \
            -o build/host-tests/test_glsd301p_health
      - name: Install 32-bit toolchain for pool-exact harnesses
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386
          ls /usr/lib32/libasan* /usr/lib32/libubsan* 2>/dev/null || true
          echo 'int main(void){return 0;}' > build/m32probe.c
          cc -m32 -fsanitize=address,undefined build/m32probe.c -o build/m32probe
          build/m32probe
          echo 'M32_TOOLCHAIN=PASS'
      - name: Build M4 dispatch harness (real patched SDK ZCL + ASan/UBSan)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host-tests/obj build/host-tests/obj32
          # Own code stays -Werror, but the dispatch translation units
          # necessarily include the real vendor ZCL headers (compiler
          # attributes), so they compile as gnu11 without -pedantic; the
          # pinned SDK bodies compile without -Werror as in the M3 block.
          # -DWIN32 is the SDK's own size_t opt-out (types.h); own code
          # keys nothing off it, and the staging gate above proves the
          # staged ZCL set behavior-neutral under it.
          # Everything in this binary is -m32: ev_buffer.c and mempool.c
          # carry 32-bit layout assumptions (like the TC32 target), so the
          # host pool matches the target pool exactly.
          strict_zcl="-std=gnu11 -DWIN32 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          sdkflags="-std=gnu11 -DWIN32 -fsanitize=address,undefined -fno-omit-frame-pointer"
          inc="-Isrc -Itests/host"
          zclinc="-Ibuild/host-sdk/zigbee -Ibuild/host-sdk/zigbee/zcl -Ibuild/host-sdk/proj"
          zclsrc='build/host-sdk/zigbee/zcl/general'
          for unit in ev_timer ev_rtc; do
            # shellcheck disable=SC2086
            cc -m32 $sdkflags -Isrc -Itests/host -Ibuild/host-sdk/proj/os $zclinc \
              -c "build/host-sdk/proj/os/$unit.c" -o "build/host-tests/obj32/$unit.o"
          done
          # shellcheck disable=SC2086
          cc -m32 $sdkflags $zclinc -c build/host-sdk/proj/common/mempool.c \
            -o build/host-tests/obj32/mempool.o
          # ev_buffer.c is the only staged body using the SDK assert()
          # (common/assert.h: no-op unless ASSERT_DEBUG_MODE, off). It is
          # injected here surgically: routing it through tl_common.h would
          # poison the C assertions of every TU parsing the ZCL shim.
          # shellcheck disable=SC2086
          cc -m32 $sdkflags "-Dassert(ignore)=((void)0)" \
            -Ibuild/host-sdk/proj/os $zclinc \
            -c build/host-sdk/proj/os/ev_buffer.c -o build/host-tests/obj32/ev_buffer.o
          for unit in zcl zcl_reporting; do
            # shellcheck disable=SC2086
            cc -m32 $sdkflags -Ibuild/host-sdk/proj/os $zclinc \
              -c "build/host-sdk/zigbee/zcl/$unit.c" \
              -o "build/host-tests/obj32/$unit.o"
          done
          for unit in zcl_basic zcl_identify zcl_group zcl_level zcl_onoff; do
            # shellcheck disable=SC2086
            cc -m32 $sdkflags -Ibuild/host-sdk/proj/os $zclinc \
              -c "$zclsrc/$unit.c" \
              -o "build/host-tests/obj32/$unit.o"
          done
          # shellcheck disable=SC2086
          cc -m32 $sdkflags -Ibuild/host-sdk/proj/os $zclinc \
            -c build/host-sdk/zigbee/zcl/ota_upgrading/zcl_ota.c \
            -o build/host-tests/obj32/zcl_ota.o
          # shellcheck disable=SC2086
          cc -m32 $strict_zcl -Isrc -Itests/host -Ibuild/host-sdk/proj/os $zclinc \
            -c src/glsd301p_timer_events.c \
            -o build/host-tests/obj32/timer_events.o
          sdkobj32='build/host-tests/obj32/ev_timer.o build/host-tests/obj32/ev_rtc.o build/host-tests/obj32/mempool.o build/host-tests/obj32/ev_buffer.o build/host-tests/obj32/zcl.o build/host-tests/obj32/zcl_reporting.o build/host-tests/obj32/zcl_basic.o build/host-tests/obj32/zcl_identify.o build/host-tests/obj32/zcl_group.o build/host-tests/obj32/zcl_level.o build/host-tests/obj32/zcl_onoff.o build/host-tests/obj32/zcl_ota.o'
          # shellcheck disable=SC2086
          cc -m32 $strict_zcl -Ibuild/host-sdk/proj/os $zclinc $inc $sdkobj32 \
            build/host-tests/obj32/timer_events.o src/glsd301p_uart_frame.c \
            src/glsd301p_power_stage_policy.c src/glsd301p_output_guard.c \
            src/glsd301p_push_input.c src/glsd301p_pb4_compat.c src/glsd301p_runtime_core.c \
            src/glsd301p_uart_transport.c src/glsd301p_timebase.c src/glsd301p_uart_service.c \
            src/glsd301p_control.c src/glsd301p_identify.c src/glsd301p_zcl_commands.c tests/host/hw_stub.c \
            tests/test_glsd301p_zcl_dispatch.c -o build/host-tests/test_glsd301p_zcl_dispatch
      - name: R25/R26 mutant controls (ephemeral copies, expect kill)
        shell: bash
        run: |
          set -euo pipefail
          # All mutants live in ephemeral $RUNNER_TEMP copies; production
          # sources, frozen refs and the staged SDK are never modified.
          # Each mutant must be KILLED (nonzero oracle exit). A SURVIVED
          # mutant fails this step. M1 expects red here (dead work
          # counter, no allocation oracle, host-only layout asserts);
          # M2 turns every leg green without changing these expectations.
          strict_zcl="-std=gnu11 -DWIN32 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          sdkflags="-std=gnu11 -DWIN32 -fsanitize=address,undefined -fno-omit-frame-pointer"
          inc="-Isrc -Itests/host"
          zclinc="-Ibuild/host-sdk/zigbee -Ibuild/host-sdk/zigbee/zcl -Ibuild/host-sdk/proj"
          zclsrc='build/host-sdk/zigbee/zcl/general'
          sdkobj32='build/host-tests/obj32/ev_timer.o build/host-tests/obj32/ev_rtc.o build/host-tests/obj32/mempool.o build/host-tests/obj32/ev_buffer.o build/host-tests/obj32/zcl.o build/host-tests/obj32/zcl_reporting.o build/host-tests/obj32/zcl_basic.o build/host-tests/obj32/zcl_identify.o build/host-tests/obj32/zcl_group.o build/host-tests/obj32/zcl_level.o build/host-tests/obj32/zcl_onoff.o build/host-tests/obj32/zcl_ota.o'
          mut="$RUNNER_TEMP/glsd301p-mutants"
          mkdir -p "$mut"
          verdict=0
          # --- R25: slow-loop tick mutant vs the r19 work oracle ---
          python3 tools/glsd301p_make_tick_mutant.py --src src/glsd301p_identify.c --out "$mut/identify.c"
          grep -q R25_MUTANT_LOOP_ACTIVE "$mut/identify.c"
          # shellcheck disable=SC2086
          cc -m32 $strict_zcl -Ibuild/host-sdk/proj/os $zclinc $inc $sdkobj32 \
            build/host-tests/obj32/timer_events.o src/glsd301p_uart_frame.c \
            src/glsd301p_power_stage_policy.c src/glsd301p_output_guard.c \
            src/glsd301p_push_input.c src/glsd301p_pb4_compat.c src/glsd301p_runtime_core.c \
            src/glsd301p_uart_transport.c src/glsd301p_timebase.c src/glsd301p_uart_service.c \
            src/glsd301p_control.c "$mut/identify.c" src/glsd301p_zcl_commands.c tests/host/hw_stub.c \
            tests/test_glsd301p_zcl_dispatch.c -o "$mut/dispatch_work"
          if "$mut/dispatch_work" r19_bound >"$mut/work.log" 2>&1; then
            grep -q R25_MUTANT_LOOP_ACTIVE "$mut/work.log"
            echo 'R25_MUTANT=SURVIVED (dead counter cannot see the loop)'
            verdict=1
          else
            grep -q R25_MUTANT_LOOP_ACTIVE "$mut/work.log"
            echo 'R25_MUTANT=KILLED'
          fi
          # --- R26: u16->u8 allocation narrowing vs r26_boundary ---
          mkdir -p "$mut/sdk/zigbee/zcl"
          sed -e 's/u16 len = sizeof(zclCfgReportCmd_t)/u8 len = sizeof(zclCfgReportCmd_t)/' \
              -e 's/u16 len = sizeof(zclCfgReportRspCmd_t)/u8 len = sizeof(zclCfgReportRspCmd_t)/' \
              -e 's/u16 len = sizeof(zclReadReportCfgRspCmd_t)/u8 len = sizeof(zclReadReportCfgRspCmd_t)/' \
              build/host-sdk/zigbee/zcl/zcl.c > "$mut/sdk/zigbee/zcl/zcl.c"
          grep -q 'u8 len = sizeof(zclCfgReportCmd_t)' "$mut/sdk/zigbee/zcl/zcl.c"
          # shellcheck disable=SC2086
          cc -m32 $sdkflags -Ibuild/host-sdk/proj/os $zclinc \
            -c "$mut/sdk/zigbee/zcl/zcl.c" -o "$mut/zcl_narrow.o"
          sdkobj_narrow=$(echo "$sdkobj32" | sed 's|build/host-tests/obj32/zcl.o|'"$mut"'/zcl_narrow.o|')
          # shellcheck disable=SC2086
          cc -m32 $strict_zcl -Ibuild/host-sdk/proj/os $zclinc $inc $sdkobj_narrow \
            build/host-tests/obj32/timer_events.o src/glsd301p_uart_frame.c \
            src/glsd301p_power_stage_policy.c src/glsd301p_output_guard.c \
            src/glsd301p_push_input.c src/glsd301p_pb4_compat.c src/glsd301p_runtime_core.c \
            src/glsd301p_uart_transport.c src/glsd301p_timebase.c src/glsd301p_uart_service.c \
            src/glsd301p_control.c src/glsd301p_identify.c src/glsd301p_zcl_commands.c tests/host/hw_stub.c \
            tests/test_glsd301p_zcl_dispatch.c -o "$mut/dispatch_narrow"
          if "$mut/dispatch_narrow" r26_boundary >"$mut/narrow.log" 2>&1; then
            echo 'R26_NARROW_MUTANT=SURVIVED (no allocation oracle; pool slack hides it)'
            verdict=1
          else
            echo 'R26_NARROW_MUTANT=KILLED'
          fi
          # --- R26: packed target-layout binary vs the host r26 oracle ---
          mkdir -p "$mut/objp"
          packed_zcl="-std=gnu11 -DWIN32 -Wall -Wextra -Werror -fpack-struct -fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer -DGLSD301P_PACKED_TARGET_LAYOUT"
          packed_sdk="-std=gnu11 -DWIN32 -fpack-struct -fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer"
          for unit in ev_timer ev_rtc; do
            # shellcheck disable=SC2086
            cc -m32 $packed_sdk -Isrc -Itests/host -Ibuild/host-sdk/proj/os $zclinc \
              -c "build/host-sdk/proj/os/$unit.c" -o "$mut/objp/$unit.o"
          done
          # shellcheck disable=SC2086
          cc -m32 $packed_sdk $zclinc -c build/host-sdk/proj/common/mempool.c \
            -o "$mut/objp/mempool.o"
          # shellcheck disable=SC2086
          cc -m32 $packed_sdk "-Dassert(ignore)=((void)0)" \
            -Ibuild/host-sdk/proj/os $zclinc \
            -c build/host-sdk/proj/os/ev_buffer.c -o "$mut/objp/ev_buffer.o"
          for unit in zcl zcl_reporting; do
            # shellcheck disable=SC2086
            cc -m32 $packed_sdk -Ibuild/host-sdk/proj/os $zclinc \
              -c "build/host-sdk/zigbee/zcl/$unit.c" \
              -o "$mut/objp/$unit.o"
          done
          for unit in zcl_basic zcl_identify zcl_group zcl_level zcl_onoff; do
            # shellcheck disable=SC2086
            cc -m32 $packed_sdk -Ibuild/host-sdk/proj/os $zclinc \
              -c "$zclsrc/$unit.c" \
              -o "$mut/objp/$unit.o"
          done
          # shellcheck disable=SC2086
          cc -m32 $packed_sdk -Ibuild/host-sdk/proj/os $zclinc \
            -c build/host-sdk/zigbee/zcl/ota_upgrading/zcl_ota.c \
            -o "$mut/objp/zcl_ota.o"
          # shellcheck disable=SC2086
          cc -m32 $packed_sdk -Ibuild/host-sdk/proj/os $zclinc \
            -c src/glsd301p_timer_events.c \
            -o "$mut/objp/timer_events.o"
          sdkobj_packed="$mut/objp/ev_timer.o $mut/objp/ev_rtc.o $mut/objp/mempool.o $mut/objp/ev_buffer.o $mut/objp/zcl.o $mut/objp/zcl_reporting.o $mut/objp/zcl_basic.o $mut/objp/zcl_identify.o $mut/objp/zcl_group.o $mut/objp/zcl_level.o $mut/objp/zcl_onoff.o $mut/objp/zcl_ota.o"
          # shellcheck disable=SC2086
          cc -m32 $packed_zcl -Ibuild/host-sdk/proj/os $zclinc $inc $sdkobj_packed \
            "$mut/objp/timer_events.o" src/glsd301p_uart_frame.c \
            src/glsd301p_power_stage_policy.c src/glsd301p_output_guard.c \
            src/glsd301p_push_input.c src/glsd301p_pb4_compat.c src/glsd301p_runtime_core.c \
            src/glsd301p_uart_transport.c src/glsd301p_timebase.c src/glsd301p_uart_service.c \
            src/glsd301p_control.c src/glsd301p_identify.c src/glsd301p_zcl_commands.c tests/host/hw_stub.c \
            tests/test_glsd301p_zcl_dispatch.c -o "$mut/dispatch_packed"
          if "$mut/dispatch_packed" r26_boundary >"$mut/packed.log" 2>&1; then
            echo 'R26_PACKED_RUN=PASS (host oracle unexpectedly holds packed)'
          else
            echo 'R26_PACKED_RUN=DIVERGED (layout delta demonstrated; host oracle is host-only)'
            cat "$mut/packed.log"
            verdict=1
          fi
          if [ "$verdict" -ne 0 ]; then
            echo 'GLSD301P_MUTANTS=RED'
            exit 1
          fi
          echo 'GLSD301P_MUTANTS=PASS'
      - name: Run original-body reproductions (pristine SDK, expect failure)
        shell: bash
        run: |
          set -euo pipefail
          # Each repro case must FAIL (sanitizer abort or REPRO marker):
          # exit 0 means the original defect did not reproduce and fails
          # this step.
          strict_repro="-std=gnu11 -DWIN32 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          sdkflags="-std=gnu11 -DWIN32 -fsanitize=address,undefined -fno-omit-frame-pointer"
          oinc='-Itests/host -Ibuild/orig-sdk/zigbee -Ibuild/orig-sdk/zigbee/zcl -Ibuild/orig-sdk/proj'
          # Same unit list as the M4 dispatch link (minus the level parser,
          # which no repro case drives) so the pristine external surface
          # resolves exactly as it does for the hardened harness.
          for unit in ev_timer ev_rtc; do
            gcc -m32 $sdkflags -Ibuild/orig-sdk/proj/os $oinc \
              -c "build/orig-sdk/proj/os/$unit.c" \
              -o "build/host-tests/obj32/repro_$unit.o"
          done
          gcc -m32 $sdkflags $oinc \
            -c build/orig-sdk/proj/common/mempool.c \
            -o build/host-tests/obj32/repro_mempool.o
          gcc -m32 $sdkflags "-Dassert(ignore)=((void)0)" \
            -Ibuild/orig-sdk/proj/os $oinc \
            -c build/orig-sdk/proj/os/ev_buffer.c \
            -o build/host-tests/obj32/repro_ev_buffer.o
          for unit in zcl zcl_reporting; do
            gcc -m32 $sdkflags -Ibuild/orig-sdk/proj/os $oinc \
              -c "build/orig-sdk/zigbee/zcl/$unit.c" \
              -o "build/host-tests/obj32/repro_$unit.o"
          done
          for unit in zcl_basic zcl_identify zcl_group zcl_onoff; do
            gcc -m32 $sdkflags -Ibuild/orig-sdk/proj/os $oinc \
              -c "build/orig-sdk/zigbee/zcl/general/$unit.c" \
              -o "build/host-tests/obj32/repro_$unit.o"
          done
          gcc -m32 $sdkflags -Ibuild/orig-sdk/proj/os $oinc \
            -c build/orig-sdk/zigbee/zcl/ota_upgrading/zcl_ota.c \
            -o build/host-tests/obj32/repro_zcl_ota.o
          reproobj='build/host-tests/obj32/repro_ev_timer.o build/host-tests/obj32/repro_ev_rtc.o build/host-tests/obj32/repro_mempool.o build/host-tests/obj32/repro_ev_buffer.o build/host-tests/obj32/repro_zcl.o build/host-tests/obj32/repro_zcl_reporting.o build/host-tests/obj32/repro_zcl_basic.o build/host-tests/obj32/repro_zcl_identify.o build/host-tests/obj32/repro_zcl_group.o build/host-tests/obj32/repro_zcl_onoff.o build/host-tests/obj32/repro_zcl_ota.o'
          # shellcheck disable=SC2086
          cc -m32 $strict_repro -Isrc -Ibuild/orig-sdk/proj/os $oinc \
            $reproobj tests/host/hw_stub.c \
            tests/repro_glsd301p_original_bodies.c \
            -o build/host-tests/repro_original_bodies
          fails=0
          for c in identify0 identify1 triggereffect1 queryrsp0 groupadd1 groupview1 groupmember1 write1 cfgwrap40 cfgtrunc discrsp0 dfltrsp1 dflt0 readrsp4 writersp2 cfgrsp3 report4 disc1 disc2 disc4 readodd otaqueryrsp2 otablockshort r8leak reportstruct reportnested reportrestype reportarray cfgdir2 cfgrspdir2 readcfgrspdir2; do
            set +e
            build/host-tests/repro_original_bodies "$c" > "build/repro-$c.log" 2>&1
            rc=$?
            set -e
            # A nonzero exit only counts when the log proves the defect
            # fired (sanitizer abort or REPRO marker): fixture assertion
            # failures must fail this step, never masquerade as repro.
            if [ "$rc" -eq 0 ]; then
              echo "REPRO-NOT-REPRODUCED: $c (exit 0)" >&2
              fails=$((fails + 1))
            elif grep -Eq 'AddressSanitizer|runtime error:|^REPRO: ' "build/repro-$c.log"; then
              echo "REPRO-OK: $c exit=$rc $(grep -Eo 'AddressSanitizer: [A-Za-z-]+|runtime error: [^ ]+|^REPRO: .*' build/repro-$c.log | head -c 160 | tr '\n' ' ')"
            else
              echo "REPRO-INFRA-FAIL: $c exit=$rc $(tail -c 200 build/repro-$c.log | tr '\n' ' ')" >&2
              fails=$((fails + 1))
            fi
          done
          test "$fails" -eq 0
          echo 'ORIGINAL_BODY_REPRO=PASS all pristine defects reproduced'
      - name: Run host-side interoperability tests
        shell: bash
        run: |
          set -euo pipefail
          build/host-tests/test_glsd301p_uart_frame
          build/host-tests/test_glsd301p_push_input
          build/host-tests/test_glsd301p_pb4_compat
          build/host-tests/test_glsd301p_uart_transport
          build/host-tests/test_glsd301p_output_guard
          build/host-tests/test_glsd301p_runtime_core
          build/host-tests/test_glsd301p_runtime_transport
          build/host-tests/test_glsd301p_timebase
          build/host-tests/test_glsd301p_uart_service
          build/host-tests/test_glsd301p_timer_events
          build/host-tests/test_glsd301p_control
          build/host-tests/test_glsd301p_rejoin
          build/host-tests/test_glsd301p_zcl_dispatch
          build/host-tests/test_glsd301p_health
      - name: Run health decoder fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_glsd301p_health_decode.py -v
      - name: Adversarially verify End Device architecture firewall
        shell: bash
        run: bash tests/test_glsd301p_target_contract.sh

  tc32-end-device-target:
    name: Pinned TC32 TLSR8258 RX-on-idle End Device target
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "SOURCE_HEAD=$actual"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          test "$actual" = "$EXPECTED_HEAD"
      - name: Checkout pinned public Telink SDK
        uses: actions/checkout@v4
        with:
          repository: telink-semi/telink_zigbee_sdk
          ref: V3.7.2.0
          path: telink-sdk
      - name: Verify exact SDK commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C telink-sdk rev-parse HEAD)"
          expected='d5bc2f7b0c1f8536fe21c8127ca680ea8214bc8e'
          test "$actual" = "$expected"
          echo "TELINK_SDK_COMMIT=$actual"
      - name: Acquire hash-pinned official TC32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          url='https://shyboy.oss-cn-shenzhen.aliyuncs.com/readonly/tc32_gcc_v2.0.tar.bz2'
          expected='33b854be3e3db3dba4b4dacdda2cd4ea1c94dfd4d562864a095956de7991b430'
          archive="$RUNNER_TEMP/tc32_gcc_v2.0.tar.bz2"
          root="$RUNNER_TEMP/tc32"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "$expected  $archive" | sha256sum --check --strict
          mkdir -p "$root"
          tar -xjf "$archive" -C "$root"
          bindir="$(dirname "$(find "$root" -type f -name tc32-elf-gcc -print -quit)")"
          test -x "$bindir/tc32-elf-gcc"
          chmod +x "$bindir"/* || true
          echo "TC32_CC=$bindir/tc32-elf-gcc" >> "$GITHUB_ENV"
          "$bindir/tc32-elf-gcc" --version | head -n 1
      - name: Reference-only same-model ADC flash-guard broad analysis
        shell: bash
        run: |
          set -uo pipefail
          ota='devices/gl-sd-301p/vendor-firmware/originals/GL-SD-301P_V20851203_20251230.ota'
          sdk="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          set +e
          python3 devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard.py --ota "$ota" --sdk-root "$sdk" --tc32-cc "$TC32_CC" | tee "$RUNNER_TEMP/adc-flash-guard-reference.json"
          rc=${PIPESTATUS[0]}; set -e
          if [[ "$rc" -eq 0 ]]; then echo 'VENDOR_ADC_FLASH_GUARD_BROAD_REFERENCE=STRONG_MATCH'; elif [[ "$rc" -eq 3 ]]; then echo 'VENDOR_ADC_FLASH_GUARD_BROAD_REFERENCE=INCONCLUSIVE'; else exit "$rc"; fi
      - name: Reference-only relocation-anchored ADC flash-guard callsite analysis
        shell: bash
        run: |
          set -uo pipefail
          ota='devices/gl-sd-301p/vendor-firmware/originals/GL-SD-301P_V20851203_20251230.ota'
          sdk="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          set +e
          python3 devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard_callsite.py --ota "$ota" --sdk-root "$sdk" --tc32-cc "$TC32_CC" | tee "$RUNNER_TEMP/adc-flash-guard-callsite.json"
          rc=${PIPESTATUS[0]}; set -e
          if [[ "$rc" -eq 0 ]]; then echo 'VENDOR_ADC_FLASH_GUARD_CALLSITE=STRONG_MATCH'; elif [[ "$rc" -eq 3 ]]; then echo 'VENDOR_ADC_FLASH_GUARD_CALLSITE=INCONCLUSIVE'; else exit "$rc"; fi
      - name: Reference-only narrow semantic ADC flash-guard analysis
        shell: bash
        run: |
          set -uo pipefail
          ota='devices/gl-sd-301p/vendor-firmware/originals/GL-SD-301P_V20851203_20251230.ota'
          sdk="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          set +e
          python3 devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard_semantics.py --ota "$ota" --sdk-root "$sdk" --tc32-cc "$TC32_CC" | tee "$RUNNER_TEMP/adc-flash-guard-semantics.json"
          rc=${PIPESTATUS[0]}; set -e
          if [[ "$rc" -eq 0 ]]; then echo 'VENDOR_ADC_FLASH_GUARD_SEMANTICS=STRONG_MATCH'; elif [[ "$rc" -eq 3 ]]; then echo 'VENDOR_ADC_FLASH_GUARD_SEMANTICS=INCONCLUSIVE'; else exit "$rc"; fi
      - name: Reference-only exact-anchor ADC caller analysis
        shell: bash
        run: |
          set -uo pipefail
          ota='devices/gl-sd-301p/vendor-firmware/originals/GL-SD-301P_V20851203_20251230.ota'
          sdk="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          set +e
          python3 devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard_callgraph.py --ota "$ota" --sdk-root "$sdk" --tc32-cc "$TC32_CC" | tee "$RUNNER_TEMP/adc-flash-guard-callgraph.json"
          rc=${PIPESTATUS[0]}; set -e
          if [[ "$rc" -eq 0 ]]; then echo 'VENDOR_ADC_FLASH_GUARD_CALLGRAPH=STRONG_MATCH'; elif [[ "$rc" -eq 3 ]]; then echo 'VENDOR_ADC_FLASH_GUARD_CALLGRAPH=INCONCLUSIVE'; else exit "$rc"; fi
      - name: Require exact semantic ADC flash-guard argument flow
        shell: bash
        run: |
          set -euo pipefail
          ota='devices/gl-sd-301p/vendor-firmware/originals/GL-SD-301P_V20851203_20251230.ota'
          sdk="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          python3 devices/gl-sd-301p/vendor-firmware/reference-analysis/analyze_adc_flash_guard_argflow.py --ota "$ota" --sdk-root "$sdk" --tc32-cc "$TC32_CC" | tee "$RUNNER_TEMP/adc-flash-guard-argflow.json"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['confidence_gate']=='PASS'; assert r['derived_pin']=='GPIO_PB3'; assert r['vendor_argument_state']['mode_value']==r['compiler_derived_abi']['vbat_mode_value']; print('VENDOR_ADC_FLASH_SAFETY_PIN=GPIO_PB3_CONFIRMED')" "$RUNNER_TEMP/adc-flash-guard-argflow.json"
          echo 'REFERENCE_ANALYSIS_ARTIFACT_UPLOAD=NONE'
      - name: Probe unresolved symbols across Telink role archives
        shell: bash
        run: |
          set -euo pipefail
          export TELINK_SDK_ROOT="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          bash tools/probe_telink_role_symbol_ownership.sh
      - name: Compile, link and finalize quarantined End Device target
        shell: bash
        run: |
          set -euo pipefail
          export TELINK_SDK_ROOT="$GITHUB_WORKSPACE/telink-sdk/tl_zigbee_sdk"
          export OUT_DIR="$RUNNER_TEMP/glsd301p-ed"
          bash tools/build_glsd301p_ed_tc32.sh
          cat "$OUT_DIR/target/manifest.txt"
      - name: Enforce no deployment artifact publication
        shell: bash
        run: |
          set -euo pipefail
          echo 'CI_ARTIFACT_UPLOAD=NONE'
          echo 'FIRST_FLASHABLE_CANARY_ALLOWED=NO'
