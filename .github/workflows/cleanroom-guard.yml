name: Clean-room guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanroom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject proprietary firmware and unresolved production gates
        run: python3 tools/check_cleanroom.py
