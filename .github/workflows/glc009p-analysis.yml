name: GL-C-009P Firmware Analysis
on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download and extract GL-C-009P firmware
        run: |
          cat > download_and_extract.py << 'PYEOF'
          import urllib.request
          import json
          import base64
          import hashlib
          import struct
          from pathlib import Path

          TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          BLOB_SHA = "09c1e5ad3874a422cbe1e87e351e6478d4e1272e"
          EXPECTED_SHA512 = "868e671255db3c753a282125cdc4c333771cf1032423968b1412f9760cb105f97874261ab56559dc1cf54c0742eec062ccf9b8a75b4ef5e85b1485e8d5fd1aac"

          url = f"https://api.github.com/repos/Koenkk/zigbee-OTA/git/blobs/{BLOB_SHA}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github.v3+json"
          })
          
          with urllib.request.urlopen(req) as resp:
              blob = json.loads(resp.read().decode())
          
          data = base64.b64decode(blob['content'])
          sha512 = hashlib.sha512(data).hexdigest()
          assert sha512 == EXPECTED_SHA512, f"HASH MISMATCH: {sha512}"
          
          print(f"✓ SHA-512 verified: {sha512[:32]}...")
          print(f"Total OTA size: {len(data)} bytes")
          
          # Parse OTA header
          magic, = struct.unpack_from("<I", data, 0)
          header_length, = struct.unpack_from("<H", data, 6)
          manufacturer_code, = struct.unpack_from("<H", data, 10)
          image_type, = struct.unpack_from("<H", data, 12)
          file_version, = struct.unpack_from("<I", data, 14)
          
          print(f"Magic: {hex(magic)}")
          print(f"Header length: {header_length}")
          print(f"Manufacturer: {hex(manufacturer_code)}")
          print(f"Image type: {hex(image_type)}")
          print(f"File version: {hex(file_version)}")
          
          inner = data[header_length:]
          print(f"Inner image size: {len(inner)} bytes")
          
          # Save both files
          Path("glc009p_full.ota").write_bytes(data)
          Path("glc009p_inner.bin").write_bytes(inner)
          print("✓ Saved glc009p_full.ota and glc009p_inner.bin")
          PYEOF
          
          python download_and_extract.py
      
      - name: Analyze firmware patterns
        run: |
          cat > analyze_firmware.py << 'PYEOF'
          import re
          from pathlib import Path
          from collections import Counter

          def find_strings(data, min_len=4):
              pattern = re.compile(rb'[\x20-\x7e]{%d,}' % min_len)
              return [(m.start(), m.group().decode('ascii', errors='replace')) for m in pattern.finditer(data)]

          def search_patterns(data):
              results = {}
              
              patterns = {
                  'tuya_headers': [b'\x55\xaa'],
                  'tuya_strings': [b'tuya', b'TUYA', b'dp_id', b'mcu_send'],
                  'uart_strings': [b'uart', b'UART', b'serial', b'baud', b'115200', b'9600'],
                  'gpio_strings': [b'gpio', b'GPIO', b'pwm', b'PWM', b'timer', b'dimmer'],
                  'telink_strings': [b'TLSR', b'tlsr', b'8258', b'8266', b'B91', b'telink'],
                  'vendor_strings': [b'GLEDOPTO', b'gledopto', b'Candeo', b'GL-SD', b'GL-C']
              }
              
              for category, search_bytes in patterns.items():
                  results[category] = {}
                  for s in search_bytes:
                      positions = []
                      pos = 0
                      while True:
                          pos = data.find(s, pos)
                          if pos == -1:
                              break
                          positions.append(pos)
                          pos += 1
                      if positions:
                          results[category][s.decode('ascii', errors='replace')] = len(positions)
              
              return results

          inner = Path("glc009p_inner.bin").read_bytes()
          print(f"Analyzing {len(inner)} bytes...\n")
          
          strings = find_strings(inner, min_len=4)
          print(f"=== INTERESTING STRINGS (top 30) ===")
          keywords = ['uart', 'gpio', 'pwm', 'timer', 'dim', 'level', 'tuya', 'mcu', 'serial', 
                     'baud', 'zigbee', 'telink', 'tlsr', '8258', '8266', 'b91', 'gledopto', 'candeo']
          
          interesting = [(off, s) for off, s in strings if any(kw in s.lower() for kw in keywords)]
          for offset, s in interesting[:30]:
              print(f"  0x{offset:06X}: {s}")
          
          print(f"\n=== PATTERN ANALYSIS ===")
          results = search_patterns(inner)
          
          for category, data in results.items():
              if data:
                  total_hits = sum(data.values())
                  print(f"{category}: {total_hits} total hits")
                  for key, count in sorted(data.items(), key=lambda x: x[1], reverse=True)[:3]:
                      print(f"  '{key}': {count} hits")
          
          # Decision matrix
          print(f"\n{'='*60}")
          print("DECISION MATRIX")
          print(f"{'='*60}")
          
          tuya_count = results.get('tuya_headers', {}).get('U', 0)
          uart_total = sum(results.get('uart_strings', {}).values())
          gpio_total = sum(results.get('gpio_strings', {}).values())
          
          print(f"Tuya header (0x55 0xAA): {tuya_count}")
          print(f"UART-related hits: {uart_total}")
          print(f"GPIO/PWM-related hits: {gpio_total}")
          
          if tuya_count > 5:
              print("\n→ HIGH PROBABILITY: Tuya-compatible UART protocol")
          elif uart_total > gpio_total * 2:
              print("\n→ LIKELY: Secondary MCU over UART (non-Tuya)")
          elif gpio_total > uart_total * 2:
              print("\n→ LIKELY: Direct GPIO/PWM control")
          else:
              print("\n→ INCONCLUSIVE: Need deeper disassembly")
          PYEOF
          
          python analyze_firmware.py
      
      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: firmware-analysis
          path: |
            glc009p_full.ota
            glc009p_inner.bin
