name: GL-SD-301P stock SWire recovery validation (offline only)

on:
  push:
    branches:
      - recovery/glsd301p-stock-swire-20261108
    paths:
      - "tools/glsd301p_stock_swire_recovery.py"
      - "tools/glsd301p_stock_txonly.py"
      - "tools/telink_app_finalize.py"
      - "tools/tests/test_glsd301p_stock_swire_recovery.py"
      - "tools/tests/test_glsd301p_stock_txonly.py"
      - "devices/gl-sd-301p/vendor-firmware/**"
      - ".github/workflows/glsd301p-stock-recovery.yml"
  pull_request:
    paths:
      - "tools/glsd301p_stock_swire_recovery.py"
      - "tools/glsd301p_stock_txonly.py"
      - "tools/telink_app_finalize.py"
      - "tools/tests/test_glsd301p_stock_swire_recovery.py"
      - "tools/tests/test_glsd301p_stock_txonly.py"
      - "devices/gl-sd-301p/vendor-firmware/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stock-only-no-hardware:
    name: Verify original stock OTA and bank-A write bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline stock OTA extraction and corruption/guard tests
        run: python -m unittest discover -s tools/tests -p "test_glsd301p_stock_swire_recovery.py" -v
      - name: TX-only pvvx JavaScript parity and independent phase safety tests
        run: python -m unittest discover -s tools/tests -p "test_glsd301p_stock_txonly.py" -v
      - name: TX-only offline stock image plan (NO SERIAL PORT)
        run: python tools/glsd301p_stock_txonly.py plan --output "$RUNNER_TEMP/glsd301p-stock-bank-a.bin"
      - name: Prepare exact historical vendor stock app (no serial/USB)
        run: python tools/glsd301p_stock_swire_recovery.py prepare --output "$RUNNER_TEMP/glsd301p-stock-bank-a.bin"
      - name: Assert sector-rounded writes cannot touch NV or MAC
        run: |
          export IMAGE="$RUNNER_TEMP/glsd301p-stock-bank-a.bin"
          python - <<'PY'
          import os
          from pathlib import Path
          img = Path(os.environ["IMAGE"]).read_bytes()
          end = (len(img) + 4095) & ~4095
          assert img[8:12] == b"KNLT"
          stage = Path(os.environ["IMAGE"]).with_name("glsd301p-stock-bank-a-stage.bin").read_bytes()
          activation = Path(os.environ["IMAGE"]).with_name("glsd301p-stock-bank-a-activate.bin").read_bytes()
          assert len(stage) == len(img)
          assert stage[8:12] == bytes.fromhex("ff4e4c54")
          assert stage[:8] + stage[9:] == img[:8] + img[9:]
          assert activation == b"K"
          assert 0 < end <= 0x34000 < 0x40000 < 0x76000
          print(f"STOCK_RECOVERY_TWO_PHASE=PASS image={len(img)} erase_end=0x{end:x} stage=inert activation=4b")
          PY
      - name: Create checksum manifest for recovery files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum \
            glsd301p-stock-bank-a.bin \
            glsd301p-stock-bank-a-stage.bin \
            glsd301p-stock-bank-a-activate.bin \
            glsd301p-stock-bank-a.json > SHA256SUMS
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((root / "glsd301p-stock-bank-a.json").read_text())
          for key, name in [
              ("applicationSha256", "glsd301p-stock-bank-a.bin"),
              ("stagedSha256", "glsd301p-stock-bank-a-stage.bin"),
          ]:
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == report[key], f"{name} SHA mismatch"
          assert (root / "glsd301p-stock-bank-a-activate.bin").read_bytes() == b"K"
          assert report["sourceSha256"] == "16595a38ab9783d3afc4eb58ab4ec32625249bd569c1fa6dbaf468bddc76dd72"
          print("STOCK_RECOVERY_ARTIFACTS=PASS all checksums verified")
          PY
      - name: Upload validated stock SWire recovery BINs
        uses: actions/upload-artifact@v4
        with:
          name: glsd301p-stock-swire-recovery-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            ${{ runner.temp }}/glsd301p-stock-bank-a.bin
            ${{ runner.temp }}/glsd301p-stock-bank-a-stage.bin
            ${{ runner.temp }}/glsd301p-stock-bank-a-activate.bin
            ${{ runner.temp }}/glsd301p-stock-bank-a.json
            ${{ runner.temp }}/SHA256SUMS
